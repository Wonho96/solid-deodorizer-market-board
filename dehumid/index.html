const b64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function keyFrom(pw){const base=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);return crypto.subtle.deriveKey({name:'PBKDF2',salt:b64(D.s),iterations:D.i,hash:'SHA-256'},base,{name:'AES-GCM',length:256},true,['decrypt']);}
async function open(key){const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:b64(D.v)},key,b64(D.c));const html=await new Response(new Blob([pt]).stream().pipeThrough(new DecompressionStream('gzip'))).text();document.open();document.write(html);document.close();}
(async()=>{const k=localStorage.getItem('dash_k_'+D.s);if(k){try{const key=await crypto.subtle.importKey('raw',b64(k),'AES-GCM',true,['decrypt']);await open(key);return;}catch(e){localStorage.removeItem('dash_k_'+D.s);}}})();
document.getElementById('f').addEventListener('submit',async e=>{e.preventDefault();const bt=document.getElementById('bt'),er=document.getElementById('er');bt.disabled=true;bt.textContent='여는 중...';er.textContent='';
try{const key=await keyFrom(document.getElementById('pw').value);if(document.getElementById('rm').checked){const raw=new Uint8Array(await crypto.subtle.exportKey('raw',key));localStorage.setItem('dash_k_'+D.s,btoa(String.fromCharCode(...raw)));}await open(key);}catch(x){er.textContent='비밀번호가 맞지 않습니다.';bt.disabled=false;bt.textContent='열기';}});
</script></body></html>
